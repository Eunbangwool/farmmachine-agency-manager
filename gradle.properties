# ===== JVM 메모리 (Kotlin/Java 컴파일 속도) =====
# 4GB. GitHub Actions runner는 7GB RAM이라 여유 충분.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# ===== 빌드 병렬화 + 캐시 =====
org.gradle.parallel=true
org.gradle.caching=true
# :app 빌드 시 :web 모듈 구성 생략 (Node/WASM 셋업 오버헤드 제거)
org.gradle.configureondemand=true

# ===== Configuration cache =====
# 첫 빌드는 같지만 두 번째부터 50%까지 단축.
# GitHub Actions에서도 setup-gradle 캐시와 결합되면 적용됨.
org.gradle.configuration-cache=true

# ===== Kotlin 컴파일러 =====
kotlin.daemon.jvmargs=-Xmx2g
kotlin.incremental=true
# (이전 kotlin.incremental.useClasspathSnapshot 속성 제거됨 -
#  최신 Kotlin은 ABI snapshot 기반의 더 효율적인 방식 사용)
kotlin.code.style=official

# ===== Android =====
android.useAndroidX=true
android.enableJetifier=false
# 비전이적 R class - 빌드 가속
android.nonTransitiveRClass=true
# R8 풀 모드 - 더 공격적 코드 제거 (release APK 2-5MB 감소)
android.enableR8.fullMode=true

# ===== 사용 안 하는 빌드 기능 끄기 (불필요한 task 제거) =====
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.shaders=false
android.defaults.buildfeatures.buildconfig=false

