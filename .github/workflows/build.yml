# ===================================================================
# 농돌이 (대리점 앱) — 컴파일/빌드 검증 CI
# ===================================================================
# push/PR 마다 :app(Android 디버그 APK) 와 :web(WASM 번들) 을 빌드해
# 컴파일을 검증한다. (로컬에 Android SDK 가 없어 CI 로 검증.)
#
# Firebase 설정(google-services.json) 전에도 빌드되도록 google-services
# 플러그인은 app/build.gradle.kts 에서 조건부 적용된다.

name: Build

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build Android (:app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JDK 21 설정
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: assembleDebug
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug -PdebugBuild=true --no-configuration-cache 2>&1 | tee android-build.log
      - name: 빌드 로그 요약
        if: always()
        run: |
          echo '## Android build log (tail 200)' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -200 android-build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-build-log
          path: android-build.log
          retention-days: 14

  web:
    name: Build Web (:web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JDK 21 설정
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: web WASM 번들 빌드
        run: |
          set -o pipefail
          ./gradlew :web:wasmJsBrowserDistribution --no-configuration-cache 2>&1 | tee web-build.log
      - name: 빌드 로그 요약
        if: always()
        run: |
          echo '## Web build log (tail 200)' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -200 web-build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-build-log
          path: web-build.log
          retention-days: 14
