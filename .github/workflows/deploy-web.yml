# ===================================================================
# 웹 디스패처 → Firebase Hosting 자동 배포 (전용 site: nongdori)
# web/** 또는 shared/** 변경 시 빌드 후 nongdori.web.app 에 배포.
# (모바일 작업 환경 — 콘솔/CLI 수동 작업 불필요. push 만 하면 됨.)
#
# 필요한 1회 설정:
#  1) Firebase 콘솔 → Hosting → '사이트 추가' → site id: nongdori
#  2) 저장소 Secret  FIREBASE_SERVICE_ACCOUNT_JSON  (rules 배포용과 동일 SA)
#
# ⚠️ firestore:rules 는 여기서 배포하지 않는다 (--only hosting). 규칙 배포는
#    farm-work-manager 에서만.
# ===================================================================

name: Deploy Web

on:
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - 'web/**'
      - 'shared/**'
      - 'firebase.json'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build + Deploy Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew

      - name: 웹 번들 빌드
        run: ./gradlew :web:wasmJsBrowserDistribution

      - name: 산출물 정리 (public_web)
        run: |
          DIST=$(find web/build/dist -type d -name productionExecutable | head -1)
          if [ -z "$DIST" ]; then echo "❌ 빌드 산출물(productionExecutable) 없음"; exit 1; fi
          echo "dist: $DIST"
          rm -rf public_web && mkdir -p public_web && cp -r "$DIST"/. public_web/
          ls -la public_web | head

      - name: Node + Firebase CLI
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install -g firebase-tools@13

      - name: 서비스 계정 키
        env:
          SVC: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$SVC" ]; then
            echo "❌ FIREBASE_SERVICE_ACCOUNT_JSON secret 미설정 (rules 배포용과 동일 SA 등록 필요)"
            exit 1
          fi
          echo "$SVC" > /tmp/firebase-sa.json
          node -e "JSON.parse(require('fs').readFileSync('/tmp/firebase-sa.json','utf8'))" || { echo "❌ SA JSON 파싱 실패"; exit 1; }
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json" >> $GITHUB_ENV

      - name: Hosting 배포 (site=nongdori)
        run: |
          set -o pipefail
          firebase deploy --only hosting:nongdori \
            --project farm-machine-manager-prod \
            --non-interactive 2>&1 | tee /tmp/web-deploy.log

      - name: 정리
        if: always()
        run: rm -f /tmp/firebase-sa.json
